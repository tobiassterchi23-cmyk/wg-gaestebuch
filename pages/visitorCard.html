<!DOCTYPE html>

<html lang="de">

<head>
<link rel="stylesheet"
href="../css/visitorCard.css">
<meta charset="UTF-8">

<title>
Besucherkarte
</title>

</head>


<body>


<div class="visitorCard">


<div class="cardHeader">

<img
id="visitorPhoto"
class="profileImage">


<h1 id="visitorName"></h1>


<p id="visitorNumber"></p>


</div>



<div class="badgeArea">

<p id="visitorStatus"></p>

<p id="visitorBadge"></p>

<p id="visitorEasterEgg"></p>

</div>




<div class="infoBox">


<p id="visitorAge"></p>


<p id="visitDate"></p>


<p id="relationship"></p>


<p id="funFacts"></p>


<p id="dreamJob"></p>


<p id="potato"></p>


<p id="stayReason"></p>


<p id="knownFrom"></p>


<p id="favoriteItem"></p>


<p id="song"></p>


<p id="message"></p>


<p id="lastThought"></p>


<p id="rating"></p>


</div>



<div class="footerMessage">

Einmal eingetragen.
<br>
Für immer Teil der WG.

</div>


</div>



<script src="../js/visitorCard.js"></script>

</body>

</html>
